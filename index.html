      var pu = e.target.closest('[data-purpose]');
      if (pu) {
        st.purpose = pu.getAttribute('data-purpose');
        H.$$('#cf-purposes [data-purpose]', root).forEach(function (x) { x.classList.toggle('on', x === pu); });
      }
    });

    H.$('#cf-mkpersona', root).addEventListener('click', function () {
      if (!st.product) { App.toast('상품을 먼저 정해 주세요.'); return; }
      st.customPersona = null;
      st.personas = (st.product.personas || []).slice(0, 3);
      if (!st.personas.length) { App.toast('상품 분석에 고객 정보가 없어요.'); return; }
      st.persona = st.persona == null ? 0 : st.persona;
      renderPersonas(root);
      App.toast('페르소나 3개를 만들었어요. 하나를 골라 주세요.');
    });
    H.$('#cf-custom', root).addEventListener('click', function () {
      var name = window.prompt('누구의 입장에서 쓸까요? (예: 이사 앞둔 30대 직장인)');
      if (!name) return;
      var desc = window.prompt('그 사람의 상황을 한 줄로 적어 주세요. (예: 견적을 여러 곳 받을 시간이 없음)') || '';
      st.customPersona = { name: name, desc: desc };
      st.personas = []; st.persona = null;
      renderPersonas(root);
    });
    H.$('#cf-personas', root).addEventListener('click', function (e) {
      var b = e.target.closest('[data-persona]'); if (!b) return;
      st.persona = Number(b.getAttribute('data-persona'));
      renderPersonas(root);
    });
    H.$('#cf-done3', root).addEventListener('click', function () {
      if (!st.customPersona && (st.persona == null || !st.personas.length)) { App.toast('페르소나를 먼저 골라 주세요.'); return; }
      var cards = H.$$('.stepcard', root);
      if (cards[3]) cards[3].scrollIntoView({ behavior: 'smooth', block: 'center' });
      App.toast('4단계에서 원고를 만들 수 있어요.');
    });

    H.$('#cf-run', root).addEventListener('click', generate);
  }

  function generate() {
    if (!st.product) { App.toast('상품을 먼저 정해 주세요.'); return; }
    var root = H.$('#cf-app');
    if (!root) return;
    var persona = st.customPersona || (st.personas[st.persona] || (st.product.personas || [])[0] || { name: '동네 이웃', desc: '' });
    var res = A.cafeDrafts(st.product, {
      purpose: st.purpose, persona: persona, cafeName: st.cafeName || '동네 카페',
      nick: st.nick, deadline: st.deadline, quota: st.quota, extra: st.extra
    });
    st.drafts = res.drafts;
    st.comments = res.comments;
    st.cur = 0; st.edit = false; st.edits = {};
    renderRight(root);
    var right = H.$('#cf-right', root);
    if (right) right.scrollIntoView({ behavior: 'smooth', block: 'start' });
    App.toast('원고 6개를 만들었어요. 탭을 눌러 확인하세요.');
    renderBanned(root, st.drafts[0], st.drafts[0].body);
  }

  function bindRight(root, d, body) {
    var right = H.$('#cf-right', root);
    if (!right) return;
    var tabs = H.$('#cf-tabs', right);
    if (tabs) tabs.addEventListener('click', function (e) {
      var b = e.target.closest('[data-draft]'); if (!b) return;
      st.cur = Number(b.getAttribute('data-draft'));
      renderRight(root);
    });
    H.$('#cf-view', right).addEventListener('click', function (e) {
      var b = e.target.closest('[data-view]'); if (!b) return;
      st.edit = b.getAttribute('data-view') === 'edit';
      renderRight(root);
    });
    if (st.edit) {
      H.$('#cf-apply', right).addEventListener('click', function () {
        var t = H.$('#cf-title', right).value.trim();
        var bd = H.$('#cf-body', right).value;
        if (t) d.title = t;
        st.edits[d.key] = bd;
        st.edit = false;
        renderRight(root);
        App.toast('수정 내용을 반영했어요.');
      });
      H.$('#cf-revert', right).addEventListener('click', function () {
        delete st.edits[d.key];
        st.edit = false;
        renderRight(root);
        App.toast('원래 원고로 되돌렸어요.');
      });
    }
    H.$('#cf-copybody', right).addEventListener('click', function () { App.copy(body, this); });
    H.$('#cf-copyall', right).addEventListener('click', function () {
      App.copy('[제목] ' + d.title + '\n\n' + body, this);
    });
  }
})();

  var st = {
    tab: 'make', product: null, shots: [], sheet: null,

  /* --------------- 컨닝페이퍼 카드 그리기 --------------- */
  function paintSheet(p, cs, opt) {
    opt = opt || {};
    var W = 1080, Hh = 1350;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = Hh;
    var ctx = cv.getContext('2d');
    var C = A.canvas;
    var accent = opt.accent || '#FFE24B';
    var brand = opt.brand || '#2F54EB';

    /* 배경 */
    ctx.fillStyle = '#F4F7FF'; ctx.fillRect(0, 0, W, Hh);
    var g = ctx.createLinearGradient(0, 0, W, Hh * 0.6);
    g.addColorStop(0, '#DCE9FF'); g.addColorStop(1, '#F7FAFF');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh * 0.62);

    /* 상단 배지 */
    ctx.textBaseline = 'top';
    ctx.font = '800 28px Pretendard, "Apple SD Gothic Neo", sans-serif';
    var tag = opt.tag || (p.category || '동네 혜택');
    ctx.fillStyle = 'rgba(47,84,235,.12)';
    C.roundRect(ctx, 64, 56, ctx.measureText(tag).width + 40, 50, 25); ctx.fill();
    ctx.fillStyle = brand;
    ctx.fillText(tag, 84, 68);

    /* 헤드라인 (강조 하이라이트) */
    var head = cs.headline[0] || p.title;
    var size = 96, lines;
    do {
      ctx.font = '800 ' + size + 'px Pretendard, "Apple SD Gothic Neo", sans-serif';
      lines = C.wrap(ctx, head, W - 128);
      if (lines.length <= 3) break;
      size -= 6;
    } while (size > 52);
    ctx.font = '800 ' + size + 'px Pretendard, "Apple SD Gothic Neo", sans-serif';
    var y = 150;
    for (var i = 0; i < Math.min(lines.length, 3); i++) {
      var lw = ctx.measureText(lines[i]).width;
      if (i === Math.min(lines.length, 3) - 1 || lines.length === 1) {
        /* 마지막 줄에 형광펜 */
        ctx.save();
        ctx.fillStyle = accent;
        ctx.fillRect(58, y + size * 0.12, Math.min(lw + 20, W - 116), size * 0.82);
        ctx.restore();
      }
      ctx.fillStyle = '#111';
      ctx.fillText(lines[i], 64, y);
      y += Math.round(size * 1.18);
    }

    /* 서브 */
    y += 8;
    ctx.font = '700 44px Pretendard, "Apple SD Gothic Neo", sans-serif';
    ctx.fillStyle = '#2A2A33';
    var sub = cs.sub[0] || (p.benefits[0] || '');
    var sl = C.wrap(ctx, A.cut(sub, 60), W - 128);
    y = C.drawLines(ctx, sl, 64, y, 58, 2);

    /* 혜택 4블록 */
    var by = Math.max(y + 46, 560);
    var bw = (W - 128 - 28) / 2, bh = 190;
    (cs.bullets || []).slice(0, 4).forEach(function (b, i) {
      var bx = 64 + (i % 2) * (bw + 28);
      var byy = by + Math.floor(i / 2) * (bh + 24);
      ctx.save();
      ctx.shadowColor = 'rgba(30,50,120,.10)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
      ctx.fillStyle = '#FFFFFF';
      C.roundRect(ctx, bx, byy, bw, bh, 24); ctx.fill();
      ctx.restore();
      var icons = ['🎁', '🚚', '🛠', '✅', '💳', '📦'];
      ctx.font = '56px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
      ctx.fillText(icons[i % icons.length], bx + 26, byy + 26);
      ctx.font = '800 30px Pretendard, "Apple SD Gothic Neo", sans-serif';
      ctx.fillStyle = '#111';
      var tl = C.wrap(ctx, b, bw - 130);
      C.drawLines(ctx, tl, bx + 106, byy + 34, 40, 3);
    });

    /* CTA 바 */
    var ctaY = Hh - 230;
    ctx.fillStyle = brand;
    ctx.fillRect(0, ctaY, W, 150);
    ctx.fillStyle = '#FFFFFF';
    var cs2 = 54;
    do {
      ctx.font = '800 ' + cs2 + 'px Pretendard, "Apple SD Gothic Neo", sans-serif';
      if (ctx.measureText(cs.cta[0] || '').width <= W - 160) break;
      cs2 -= 4;
    } while (cs2 > 30);
    ctx.font = '800 ' + cs2 + 'px Pretendard, "Apple SD Gothic Neo", sans-serif';
    ctx.fillText(cs.cta[0] || '자세히 보기  ▶', 64, ctaY + (150 - cs2) / 2 - 6);

    /* 하단 표기 */
    ctx.font = '600 24px Pretendard, "Apple SD Gothic Neo", sans-serif';
    ctx.fillStyle = '#6D6D7A';
    var foot = (opt.foot || '조건과 혜택은 신청 페이지에서 확인하세요') + (p.domain ? ' · ' + p.domain : '');
    ctx.fillText(A.cut(foot, 60), 64, Hh - 62);
    return cv;
  }

            found.map(function (f) { return esc(f.w) + ' → <b>' + esc(f.fix) + '</b>'; }).join('<br>') + '</div>'

  /* ---------------- 카피 사전 ---------------- */
  function renderLib(body) {

        '</div></div></div>' +
      '<div class="chiprow" id="ch-purposes" style="margin-top:12px">' +

      '<div class="row2"><div class="field"><label for="ch-newp">목적</label><select id="ch-newp">' + PURPOSES.map(function (p) { return '<option>' + p + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="ch-newk">종류</label><select id="ch-newk">' + KINDS.map(function (k) { return '<option>' + k + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="field"><label for="ch-newn">메모</label><input id="ch-newn" type="text" placeholder="어떨 때 쓰는 문구인지"></div>' +
      '<div class="actions"><button class="btn btn-primary" type="button" id="ch-add">저장하기</button>' +
      '<button class="btn btn-ghost" type="button" id="ch-reset">내 문구 전체 삭제</button></div>';

    var el = { q: H.$('#ch-q', body), grid: H.$('#ch-grid', body) };

    function mine() { return S.get('cheat.mine', []); }
    function all() {
      return LIB.map(function (x, i) { return { id: 'lib' + i, p: x.p, k: x.k, t: x.t, n: x.n, lib: true }; })
        .concat(mine().map(function (x) { return { id: x.id, p: x.p, k: x.k, t: x.t, n: x.n, lib: false }; }));
    }
    function render() {
      var q = el.q.value.trim().toLowerCase();
      var list = all().filter(function (x) {
        if (st.filter.purpose !== '전체' && x.p !== st.filter.purpose) return false;
        if (st.filter.kind !== '전체' && x.k !== st.filter.kind) return false;
        if (q && (x.t + ' ' + x.n + ' ' + x.p).toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
      H.$('#ch-count', body).textContent = list.length + '개 문구 · 복사해서 바로 쓰세요.';
      if (!list.length) { el.grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><b>조건에 맞는 문구가 없어요</b>검색어나 필터를 바꿔보세요.</div>'; return; }
      el.grid.innerHTML = list.map(function (x) {
        return '<div class="ptcard"><div style="display:flex;gap:5px;flex-wrap:wrap"><span class="tag">' + esc(x.p) + '</span>' +
          '<span class="tag"' + (x.k === 'CTA' ? ' style="background:#F1ECFF;color:#4C24D6"' : '') + '>' + esc(x.k) + '</span>' +
          (x.lib ? '' : '<span class="tag ok">내 문구</span>') + '</div>' +
          '<b>' + esc(x.t) + '</b><p>' + esc(x.n || '') + '</p>' +
          '<div style="display:flex;gap:6px;margin-top:9px"><button class="btn btn-sm btn-soft" type="button" data-libcopy="' + esc(x.id) + '">복사</button>' +
          (x.lib ? '' : '<button class="btn btn-sm btn-danger" type="button" data-libdel="' + esc(x.id) + '">삭제</button>') + '</div></div>';
      }).join('');
    }

    el.q.addEventListener('input', function () { st.q = this.value; render(); });
    H.$('#ch-purposes', body).addEventListener('click', function (e) {
      var b = e.target.closest('[data-purpose]'); if (!b) return;
      st.filter.purpose = b.getAttribute('data-purpose');
      H.$$('#ch-purposes .chip', body).forEach(function (c) { c.classList.toggle('on', c === b); });
      render();
    });
    H.$('#ch-kinds', body).addEventListener('click', function (e) {
      var b = e.target.closest('[data-kind]'); if (!b) return;
      st.filter.kind = b.getAttribute('data-kind');
      H.$$('#ch-kinds .chip', body).forEach(function (c) { c.classList.toggle('on', c === b); });
      render();
    });
    el.grid.addEventListener('click', function (e) {
      var cp = e.target.closest('[data-libcopy]');
      if (cp) {
        var item = all().filter(function (x) { return x.id === cp.getAttribute('data-libcopy'); })[0];
        if (item) App.copy(item.t, cp);
        return;
      }
      var del = e.target.closest('[data-libdel]');
      if (del) {
        S.set('cheat.mine', mine().filter(function (x) { return x.id !== del.getAttribute('data-libdel'); }));
        render(); App.toast('내 문구를 삭제했어요.');
      }
    });
    H.$('#ch-add', body).addEventListener('click', function () {
      var t = H.$('#ch-new', body).value.trim();
      if (!t) { App.toast('문구를 입력해 주세요.'); return; }
      var list = mine();
      list.unshift({ id: H.uid('c'), p: H.$('#ch-newp', body).value, k: H.$('#ch-newk', body).value, t: t, n: H.$('#ch-newn', body).value.trim() });
      S.set('cheat.mine', list);
      H.$('#ch-new', body).value = ''; H.$('#ch-newn', body).value = '';
      render(); App.toast('내 문구로 저장했어요.');
    });
    H.$('#ch-reset', body).addEventListener('click', function () {
      if (!mine().length) { App.toast('저장한 문구가 없어요.'); return; }
      if (!window.confirm('내가 추가한 문구를 모두 지울까요?')) return;
      S.set('cheat.mine', []); render(); App.toast('내 문구를 비웠어요.');
    });
    render();
  }
})();

            '<div class="kv"><b>주의 조건</b><span>쓰면 안 되는 표현, 빠뜨리면 안 되는 고지</span></div>' +
            '<p class="hint">뽑은 결과는 보관함에 저장되고, 다른 자판기가 <b>“전에 등록한 상품 불러오기”</b>로 가져갑니다.</p>' +

    var el = {
      url: H.$('#an-url', root), text: H.$('#an-text', root), file: H.$('#an-shot', root),

    };

    H.$('#an-shot', root).addEventListener('change', function () {
      var files = Array.prototype.slice.call(this.files || []);
      files.slice(0, 8).forEach(function (f) {
        A.fileToDataUrl(f).then(function (d) {
          state.shots.push(d);
          H.$('#an-shots', root).innerHTML = shotsHtml();
        }, function (e) { App.toast(e.message); });
      });
      this.value = '';
    });
    H.$('#an-shots', root).addEventListener('click', function (e) {
      var b = e.target.closest('[data-shotdel]');
      if (!b) return;
      state.shots.splice(Number(b.getAttribute('data-shotdel')), 1);

      App.toast('예시 본문을 넣었어요. “붙여넣은 본문으로 분석하기”를 눌러보세요.');
    });

    function rowsFor(reading) {
      return reading ? [
        { label: '주소 확인' }, { label: '페이지 읽기' }, { label: '본문 정리' },
        { label: '신청 조건 추출' }, { label: '고객·소구점 만들기' }, { label: '보관함 저장' }
      ] : [
        { label: '본문 정리' }, { label: '신청 조건 추출' }, { label: '고객·소구점 만들기' }, { label: '보관함 저장' }
      ];
    }
    function mountProgress(rows) {
      el.prog.innerHTML = A.progressHtml('분석 중', rows);
      var box = H.$('.aiwork', el.prog);
      return {
        set: function (i, st, msg) {
          var r = H.$('[data-prow="' + i + '"]', box);
          if (!r) return;
          r.className = 'airow' + (st ? ' ' + st : '');
          if (msg) H.$('.pmsg', r).textContent = msg;
        },
        head: function (t) { H.$('.aih b', box).textContent = t; },
        done: function (t, warn) {
          var h = H.$('.aih', box);
          H.$('.spin', h).style.animation = 'none';
          H.$('.spin', h).style.borderColor = warn ? '#E0B04F' : '#15A05C';
          H.$('.spin', h).style.background = warn ? '#E0B04F' : '#15A05C';
          H.$('.spin', h).style.border = '0';
          h.style.color = warn ? '#B4551A' : '#158449';
          if (t) H.$('.aih b', box).textContent = t;
        }
      };
    }

    function finish(p) {
      var saved = A.products.save(p);
      state.product = saved;
      setTimeout(function () {
        state.view = 'detail';
        detailView(root);
        App.toast('분석을 마쳤어요. “' + A.cut(saved.title, 18) + '” 보관함에 저장했습니다.');
      }, 480);
    }

    function runText(text, rawTitle, url, via) {
      if (!text || text.replace(/\s/g, '').length < 80) { App.toast('본문이 너무 짧아요. 80자 이상 붙여넣어 주세요.'); el.text.focus(); return; }
      state.busy = true;
      var ui = mountProgress(rowsFor(false));
      ui.set(0, 'on', text.replace(/\s/g, '').length + '자');
      ui.set(1, 'run');
      var p = A.analyze({ text: text, url: url, via: via, rawTitle: rawTitle, id: state.reshootId || null });
      p.shots = state.shots.slice(0, 4);
      ui.set(1, 'on', '필드 6개');
      ui.set(2, 'run');
      setTimeout(function () {
        ui.set(2, 'on', '고객 3 · 소구점 ' + p.points.length);
        ui.set(3, 'run');
        setTimeout(function () {
          ui.set(3, 'on', '저장 완료');
          ui.done('분석 완료 · 보관함에 담았어요');
          state.busy = false;
          finish(p);
        }, 220);
      }, 260);
    }

    H.$('#an-runtext', root).addEventListener('click', function () {
      runText(el.text.value, '', A.normalizeUrl(el.url.value), state.shots.length ? '캡처 + 붙여넣기' : '본문 붙여넣기');
    });

    H.$('#an-run', root).addEventListener('click', function () {
      var url = A.normalizeUrl(el.url.value);
      if (!url) { App.toast('주소 형식이 아니에요. https://... 를 넣어 주세요.'); el.url.focus(); return; }
      if (state.busy) { App.toast('지금 분석 중이에요.'); return; }
      state.busy = true;
      var ui = mountProgress(rowsFor(true));
      ui.set(0, 'on', A.domainOf(url));
      ui.set(1, 'run', '여러 경로 시도');
      var tryLog = [];
      A.readPage(url, function (st) {
        if (st.phase === 'try') { ui.set(1, 'run', st.label + ' 시도'); }
        if (st.phase === 'ok') { ui.set(1, 'run', st.label + ' · ' + st.chars + '자'); }
        if (st.phase === 'fail') {
          tryLog.push(st.label + ' 실패: ' + st.msg);
          ui.set(1, 'run', st.label + ' 실패 → 다음 경로');
        }
      }).then(function (res) {
        ui.set(1, 'on', res.via + ' · ' + res.text.replace(/\s/g, '').length + '자');
        ui.set(2, 'run');
        var p = A.analyze({ text: res.text, url: url, via: res.via, rawTitle: res.title });
        p.shots = state.shots.slice(0, 4);
        p.rawTitle = res.title || '';
        ui.set(2, 'on', p.chars + '자 정리');
        ui.set(3, 'run');
        setTimeout(function () {
          ui.set(3, 'on', '필드 6 · 출처 문장 ' + p.fields.filter(function (f) { return f.source; }).length + '개');
          ui.set(4, 'run');
          setTimeout(function () {
            ui.set(4, 'on', '고객 3 · 소구점 ' + p.points.length);
            ui.set(5, 'run');
            setTimeout(function () {
              ui.set(5, 'on', '저장 완료');
              ui.done('분석 완료 · ' + res.via + '로 읽었어요');
              state.busy = false;
              finish(p);
            }, 220);
          }, 220);
        }, 200);
      }).catch(function (err) {
        state.busy = false;
        ui.set(1, 'bad', '모든 경로 실패');
        ui.set(2, 'bad', '중단');
        ui.done('읽지 못했어요', true);
        el.err.innerHTML = '<div class="notice" style="margin-top:12px;background:#FFF6F6;border-color:#FFD9D9;color:#8A2F2F">' +
          '<div><strong>이 페이지는 읽기가 막혔어요.</strong><br>' + esc(err.message) +
          (err.tries ? '<br><span class="small">' + err.tries.map(function (t) { return esc(t.label + ': ' + t.msg); }).join(' · ') + '</span>' : '') +
          '<br><br>① 아래 <b>본문 붙여넣기</b>에 페이지 글자를 그대로 붙여넣거나 ② <b>캡처 이미지</b>를 올린 뒤 다시 분석해 주세요. 두 방법 모두 같은 분석이 나옵니다.' +
          '</div></div>';
      });
    });
  }

  function roundRect(ctx, x0, y0, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x0 + r, y0);
    ctx.lineTo(x0 + w - r, y0); ctx.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r);
    ctx.lineTo(x0 + w, y0 + h - r); ctx.quadraticCurveTo(x0 + w, y0 + h, x0 + w - r, y0 + h);
    ctx.lineTo(x0 + r, y0 + h); ctx.quadraticCurveTo(x0, y0 + h, x0, y0 + h - r);
    ctx.lineTo(x0, y0 + r); ctx.quadraticCurveTo(x0, y0, x0 + r, y0);
    ctx.closePath();
  }

      root.innerHTML =
        '<div class="cols">' +
          '<div class="stack"><section class="panel"><h3>🔮 사주 정보 <span class="pill">양력</span></h3>' +
            '<div class="field"><label for="sj-name">이름 / 닉네임 <span class="muted small">(선택)</span></label>' +
              '<input id="sj-name" type="text" placeholder="예: 김카마" maxlength="20"></div>' +

              }).join('') + '</div></div>' +
            '<div id="sj-promo-fields" hidden>' +
              '<div class="field"><label for="sj-brand">상담소 · 채널명 <span class="muted small">(선택)</span></label>' +
                '<input id="sj-brand" type="text" placeholder="예: 김카마 사주상담" maxlength="30"></div>' +

            '<div style="margin-top:12px">' + cardHtml(r, brand, link) + '</div>' +

                '<div style="padding:0 13px 12px"><button class="btn btn-sm btn-soft" type="button" data-post="' + i + '">복사</button></div></div>';
            }).join('') + '</div></section>';
        }
        el.out.innerHTML = html;

        H.$('#sj-copy-all', el.out).addEventListener('click', function () {
          App.copy(plainReading(r), this);
        });
        H.$('#sj-copy-short', el.out).addEventListener('click', function () {
          App.copy(r.summary, this);
        });

        if (state.mode !== '1') {
          H.$('#sj-card-png', el.out).addEventListener('click', function () {
            var btn = this;
            drawCard(r, brand, link, function (url) {
              if (!url) { App.toast('카드 이미지를 만들지 못했어요. 브라우저를 바꿔 보세요.'); return; }
              var a = document.createElement('a');
              a.href = url;
              a.download = '사주카드_' + (r.input.name || '사주') + '_' + r.input.y + '-' +
                (r.input.m < 10 ? '0' + r.input.m : r.input.m) + '-' + (r.input.d < 10 ? '0' + r.input.d : r.input.d) + '.png';
              document.body.appendChild(a); a.click(); document.body.removeChild(a);
              setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
              App.toast('카드 PNG를 저장했어요.');
            });
          });
          H.$('#sj-card-copy', el.out).addEventListener('click', function () {
            App.copy(cardText(r, brand, link), this, '카드 문구를 복사했어요.');
          });
          H.$$('[data-post]', el.out).forEach(function (b) {
            b.addEventListener('click', function () {
              var i = +b.getAttribute('data-post');
              App.copy(state.posts[i].text, b, '홍보글을 복사했어요. 그대로 붙여넣으세요!');
            });
          });
        }
        window.scrollTo({ top: 0, behavior: 'auto' });
      }

      H.$('#sj-run', root).addEventListener('click', function () {
        var inp = parseInput();
        if (!inp) { App.toast('생년월일을 먼저 선택해 주세요.'); el.date.focus(); return; }
        var r = SC.buildSaju({
          name: el.name.value, y: inp.y, m: inp.m, d: inp.d, hour: inp.hour, gender: state.gender
        }, new Date());
        S.set('saju.last', {
          name: el.name.value, date: el.date.value, hour: el.hour.value === '' ? null : +el.hour.value,
          brand: el.brand.value, link: el.link.value, gender: state.gender, mode: state.mode
        });
        paint(r);
        App.toast('사주를 풀었어요!' + (r.unknownHour ? ' (시주 제외 6글자)' : ''));
      });
    }
  });
})();

        ctaLabel: H.$('#qz-cta-label', root), ctaUrl: H.$('#qz-cta-url', root),
        frameWrap: H.$('#qz-frame-wrap', root), posts: H.$('#qz-posts', root),

        meta: H.$('#qz-meta', root), sub: H.$('#qz-sub', root), postCount: H.$('#qz-postcount', root)
      };
      var state = { theme: 'love', count: 7, quiz: null, html: '', posts: [], ctaId: 'youtube' };

      var saved = S.get('quiz.last', null);
      if (saved) {
        if (saved.theme) state.theme = saved.theme;
        if (saved.count) state.count = saved.count;
        if (saved.topic) el.topic.value = saved.topic;
        if (saved.ctaId) state.ctaId = saved.ctaId;
        if (saved.ctaLabel) el.ctaLabel.value = saved.ctaLabel;
        if (saved.ctaUrl != null) el.ctaUrl.value = saved.ctaUrl;
      }

      function syncChips() {
        H.$$('[data-theme]', el.themes).forEach(function (b) {
          var on = b.getAttribute('data-theme') === state.theme;
          b.classList.toggle('on', on);
        });
        el.topicWrap.hidden = state.theme !== 'custom';
        H.$$('[data-count]', el.counts).forEach(function (b) {
          b.classList.toggle('on', +b.getAttribute('data-count') === state.count);
        });
        H.$$('[data-cta]', el.ctas).forEach(function (b) {
          b.classList.toggle('on', b.getAttribute('data-cta') === state.ctaId);
        });
      }
      syncChips();

      H.$$('[data-theme]', el.themes).forEach(function (b) {
        b.addEventListener('click', function () {
          state.theme = b.getAttribute('data-theme');
          syncChips();
          if (state.theme === 'custom') setTimeout(function () { el.topic.focus(); }, 50);
        });
      });
      H.$$('[data-count]', el.counts).forEach(function (b) {
        b.addEventListener('click', function () { state.count = +b.getAttribute('data-count'); syncChips(); });
      });
      H.$$('[data-cta]', el.ctas).forEach(function (b) {
        b.addEventListener('click', function () {
          state.ctaId = b.getAttribute('data-cta');

          for (var i = 0; i < CTAS.length; i++) if (CTAS[i].id === state.ctaId) preset = CTAS[i];

          App.toast('직접 입력을 고르면 테스트 주제를 적어주세요.');
          el.topic.focus();
          return;

          App.toast('버튼 링크는 https:// 로 시작하는 주소로 넣어주세요.');
          el.ctaUrl.focus();
          return;
        }
        var quiz = QC.buildQuiz({
          theme: state.theme, count: state.count, topic: topic,
          ctaLabel: el.ctaLabel.value, ctaUrl: url
        });
        state.quiz = quiz;
        state.html = QC.buildHTML(quiz);
        var sample = QC.computeResult(quiz, new Array(quiz.count).fill(0));
        state.posts = QC.promoPosts(quiz, sample, url);
        state.sample = sample;

        el.frameWrap.innerHTML = '<iframe class="qz-frame" id="qz-frame" title="테스트 미리보기" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms"></iframe>';
        var frame = H.$('#qz-frame', el.frameWrap);

        el.meta.textContent = quiz.title + ' · ' + quiz.count + '문항';
        el.sub.textContent = '결과 화면까지 눌러보세요';
        el.fileActions.hidden = false;
        el.fileNote.hidden = false;
        var bytes = 0;
        try { bytes = new Blob([state.html], { type: 'text/html' }).size; } catch (e) { bytes = state.html.length; }
        el.fileNote.innerHTML = '결과 화면 하단 버튼: <b>' + esc(quiz.cta.url ? quiz.cta.label + ' → ' + quiz.cta.url : '없음 (링크를 넣으면 붙습니다)') + '</b><br>' +
          '파일 크기 ' + Math.round(bytes / 1024 * 10) / 10 + 'KB · 외부 라이브러리 없이 단독 실행됩니다.';
        renderPosts();

        S.set('quiz.last', {
          theme: state.theme, count: state.count, topic: topic,
          ctaId: state.ctaId, ctaLabel: el.ctaLabel.value, ctaUrl: el.ctaUrl.value
        });
        App.toast('테스트를 만들었어요! 미리보기에서 눌러보세요.');
      }

      H.$('#qz-run', root).addEventListener('click', run);

      H.$('#qz-reload', root).addEventListener('click', function () {
        if (!state.html) { App.toast('먼저 테스트를 만들어 주세요.'); return; }
        var frame = H.$('#qz-frame', el.frameWrap);
        if (frame) frame.srcdoc = state.html;
      });

      H.$('#qz-big', root).addEventListener('click', function () {
        var panel = H.$('#qz-preview-panel', root);
        panel.classList.toggle('qz-full');
        this.textContent = panel.classList.contains('qz-full') ? '원래 크기' : '크게 보기';
      });

      H.$('#qz-download', root).addEventListener('click', function () {
        if (!state.html) { App.toast('먼저 테스트를 만들어 주세요.'); return; }
        var nm = 'quiz_' + safeName(state.quiz.title) + '_' + state.quiz.count + '문항.html';
        App.download(nm, state.html, 'text/html;charset=utf-8');
        App.toast('HTML 파일을 내려받았어요. 그대로 올리면 됩니다!');
      });

      H.$('#qz-copy-html', root).addEventListener('click', function () {
        if (!state.html) { App.toast('먼저 테스트를 만들어 주세요.'); return; }
        App.copy(state.html, this, 'HTML 전체를 복사했어요. 파일로 저장해 올리세요.');

      H.$('#qz-copy-share', root).addEventListener('click', function () {

        App.copy(txt, this, '공유 문구를 복사했어요.');
      });
    }
  });
})();

          });
        });
        el.birth.hidden = state.mode !== 'birth';
        el.sign.hidden = state.mode !== 'sign';
      }

      H.$('#dl-demo', root).addEventListener('click', function () {
        el.date.value = '1995-05-15';

        H.$('#dl-copy-all', el.out).addEventListener('click', function () { App.copy(dr.plain, this, '오늘 운세 전체를 복사했어요.'); });
        H.$$('[data-post]', el.out).forEach(function (b) {
          b.addEventListener('click', function () {
            var i = +b.getAttribute('data-post');
            App.copy(state.posts[i].text, b, '홍보 문구를 복사했어요. 그대로 붙여넣으세요!');
          });
        });
        window.scrollTo({ top: 0, behavior: 'auto' });
      }

      function run() {
        var input = {
          name: el.name.value, gender: state.gender, interest: state.interest, tone: state.tone
        };
        if (state.mode === 'birth') {
          var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(el.date.value);
          if (!m) { App.toast('생년월일을 먼저 선택해 주세요.'); el.date.focus(); return; }
          input.y = +m[1]; input.m = +m[2]; input.d = +m[3];
        } else {
          input.zodiac = el.zodiac.value;
          input.sign = el.signname.value;
        }
        var dr = DC.buildDaily(input, new Date());
        S.set('daily.last', {
          name: el.name.value, date: el.date.value, brand: el.brand.value, link: el.link.value,
          mode: state.mode, gender: state.gender, interest: state.interest, tone: state.tone,
          zodiac: el.zodiac.value, signname: el.signname.value
        });
        paint(dr);
        App.toast('오늘의 운세를 뽑았어요! 총운 ' + dr.total + '점');
      }

      H.$('#dl-run', root).addEventListener('click', run);
    }
  });
})();

        spreadDesc: H.$('#tt-spread-desc', root)
      };
      var state = { topic: 'love', spread: '1', deck: [], picked: [], reading: null, posts: [] };

      var saved = S.get('tarot.last', null);
      if (saved) {
        if (saved.topic) state.topic = saved.topic;
        if (saved.spread) state.spread = saved.spread;
        if (saved.brand) el.brand.value = saved.brand;
        if (saved.link) el.link.value = saved.link;
        H.$$('[data-topic]', root).forEach(function (x) {
          var on = x.getAttribute('data-topic') === state.topic;
          x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        H.$$('[data-spread]', root).forEach(function (x) {
          var on = x.getAttribute('data-spread') === state.spread;
          x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        var sp0 = TC.spreadOf(state.spread);
        el.need.textContent = sp0.count + '장';
        el.spreadDesc.textContent = sp0.label + ' — ' + sp0.desc;
      }

      H.$$('[data-topic]', root).forEach(function (b) {
        b.addEventListener('click', function () {
          state.topic = b.getAttribute('data-topic');
          H.$$('[data-topic]', root).forEach(function (x) { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); });
          b.classList.add('on'); b.setAttribute('aria-pressed', 'true');
          if (state.picked.length === needCount()) {
            state.reading = TC.buildReading({
              topic: state.topic, spread: state.spread, question: el.q.value, cards: state.picked
            });
            showReading(state.reading);
          }
        });
      });
      H.$$('[data-spread]', root).forEach(function (b) {
        b.addEventListener('click', function () {
          state.spread = b.getAttribute('data-spread');
          H.$$('[data-spread]', root).forEach(function (x) { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); });
          b.classList.add('on'); b.setAttribute('aria-pressed', 'true');
          var sp = TC.spreadOf(state.spread);
          el.need.textContent = sp.count + '장';
          el.spreadDesc.textContent = sp.label + ' — ' + sp.desc;
          reshuffle();
        });
      });

      function needCount() { return TC.spreadOf(state.spread).count; }

      function updateStatus() {
        el.count.textContent = state.picked.length + ' / ' + needCount() + '장 선택';
        el.run.disabled = state.picked.length !== needCount();
        el.run.textContent = el.run.disabled
          ? '🔮 리딩 보기 (' + (needCount() - state.picked.length) + '장 더)'
          : '🔮 리딩 보기';
      }

      function reshuffle(initial) {
        state.deck = TC.shuffleAll();      /* 22장을 새로 섞어 두고, 뒤집은 순서대로 사용 */
        state.picked = [];
        state.reading = null;
        var cards = H.$$('[data-card]', el.deck);
        cards.forEach(function (c, i) {
          c.classList.remove('flipped', 'picked');
          c.disabled = false;
          c.setAttribute('aria-pressed', 'false');
          c.setAttribute('aria-label', (i + 1) + '번째 카드 뒤집기');
          var face = H.$('[data-face]', c);
          if (face) face.innerHTML = '';
        });
        el.need.textContent = needCount() + '장';
        el.out.innerHTML = '<section class="panel"><h3>🃏 리딩 결과</h3><div class="empty"><b>' +
          (initial ? '카드 22장을 섞어 두었어요' : '카드를 다시 섞었어요') +
          '</b>뽑고 싶은 카드를 눌러 뒤집어 주세요.</div></section>';
        updateStatus();
      }

      el.deck.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-card]');
        if (!btn || btn.disabled || btn.classList.contains('flipped')) return;
        var idx = +btn.getAttribute('data-card');
        if (state.picked.length >= needCount()) {
          App.toast(needCount() + '장을 이미 뽑았어요. 다시 섞으면 새로 뽑을 수 있습니다.');
          return;
        }
        var drawn = state.deck[idx];
        if (!drawn) return;
        var face = H.$('[data-face]', btn);
        if (face) face.innerHTML = cardFace(drawn);   /* 뒤집는 순간에만 앞면을 그립니다 */
        btn.classList.add('flipped', 'picked');
        btn.setAttribute('aria-pressed', 'true');
        btn.setAttribute('aria-label', drawn.card.name + (drawn.reversed ? ' 역방향' : ' 정방향'));
        state.picked.push(drawn);
        updateStatus();
        if (state.picked.length === needCount()) {
          App.toast('카드 ' + needCount() + '장을 다 뽑았어요. 리딩 보기를 눌러주세요.');
          el.run.focus({ preventScroll: true });
        }
      });

      el.run.addEventListener('click', function () {
        if (state.picked.length !== needCount()) { App.toast('카드를 먼저 뽑아 주세요.'); return; }
        var r = TC.buildReading({
          topic: state.topic, spread: state.spread,
          question: el.q.value, cards: state.picked
        });
        state.reading = r;
        S.set('tarot.last', { topic: state.topic, spread: state.spread, brand: el.brand.value, link: el.link.value });
        showReading(r);
        App.toast('리딩을 봤어요 — ' + r.verdict.label);
      });

      H.$('#tt-shuffle', root).addEventListener('click', function () {
        reshuffle();
        App.toast('카드를 새로 섞었어요.');
      });

      function showReading(r) {
        var brand = el.brand.value.trim();
        var link = String(el.link.value || '').trim();
        state.posts = TC.promo(r, brand, link);
        el.out.innerHTML = '<section class="panel"><h3>🃏 리딩 결과 <span class="pill">' + esc(r.input.spreadLabel) + '</span></h3>' +
          '<p class="psub"><b>' + esc(r.headline) + '</b> · ' + esc(r.verdict.label) + '</p>' +
          '<div style="margin-top:12px">' + readingHtml(r) + '</div></section>' + postsHtml(state.posts);

        H.$('#tt-copy-all', el.out).addEventListener('click', function () { App.copy(r.plain, this, '리딩 전체를 복사했어요.'); });
        H.$('#tt-again', el.out).addEventListener('click', function () { reshuffle(); el.out.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        H.$$('[data-post]', el.out).forEach(function (b) {
          b.addEventListener('click', function () {
            var i = +b.getAttribute('data-post');
            App.copy(state.posts[i].text, b, '공유 문구를 복사했어요. 그대로 붙여넣으세요!');
          });
        });
        el.out.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      reshuffle(true);
    }
  });
})();

/* ---- init.js ---- */

   init
   ===================================================================== */
(function () {
  'use strict';
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { App.start(); });
  } else {
    App.start();
  }
})();

</script>
</body>
